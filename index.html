<!DOCTYPE html>
<html lang="en" dir="ltr">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Simon Game</title>
  <link rel="stylesheet" href="styles.css">
  <link href="https://fonts.googleapis.com/css?family=Press+Start+2P" rel="stylesheet">
</head>

<body>
  <h1 id="level-title">Press <span class="key-hint">A</span> to Start</h1>
  <p class="instructions">Repeat the pattern.</p>

  <div class="container">
    <div class="row">
      <button type="button" id="green" class="btn green" aria-label="Green button"></button>
      <button type="button" id="red" class="btn red" aria-label="Red button"></button>
    </div>

    <div class="row">
      <button type="button" id="yellow" class="btn yellow" aria-label="Yellow button"></button>
      <button type="button" id="blue" class="btn blue" aria-label="Blue button"></button>
    </div>
  </div>

  <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
  <script src="game.js"></script>

</body>

</html>
